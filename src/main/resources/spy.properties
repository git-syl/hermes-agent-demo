# p6spy 配置：开发期把真实 SQL + 实际参数值打到应用日志。
# 生产环境请勿启用（会打印全量 SQL，含潜在敏感数据）。

# 走 SLF4J，输出到应用日志（默认 logger 名 p6spy，INFO 级）。
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# 背后真实 JDBC 驱动（多数据源用到的真实驱动都要列出，逗号分隔）：PostgreSQL + MySQL。
driverlist=org.postgresql.Driver,com.mysql.cj.jdbc.Driver

# 单行格式，把参数内联进 SQL，一眼可读：耗时 | 类别 | 完整SQL。
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(executionTime)ms | %(category) | %(sql)

# 只看真正执行的语句，过滤结果集/提交回滚等噪音。
excludecategories=info,debug,result,resultset,commit,rollback

# 记录到毫秒（默认 dd-MMM-yy 不含时间）。
dateformat=yyyy-MM-dd HH:mm:ss.SSS
